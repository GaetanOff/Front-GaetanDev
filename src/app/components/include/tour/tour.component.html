<button type="button" role="switch" (click)="tour.toggle()" [attr.aria-checked]="tour.active()"
  [attr.aria-label]="tour.active() ? t().stop : t().start" [class.is-on]="tour.active()" [class.is-new]="!tour.seen()"
  class="tour-toggle fixed bottom-6 left-6 z-[60] flex items-center gap-3 rounded-full py-2 pl-2 pr-3 sm:pr-4 text-left">
  <span class="tour-orb tour-orb--sm" aria-hidden="true">
    <span class="tour-orb__core"></span>
  </span>
  <span class="hidden sm:flex flex-col leading-tight">
    <span class="text-[10px] font-semibold uppercase tracking-[0.22em] text-white/50">{{ t().badge }}</span>
    <span class="text-sm font-semibold text-white">{{ t().label }}</span>
  </span>
  <span class="tour-switch" aria-hidden="true">
    <span class="tour-switch__knob"></span>
  </span>
</button>

@if (tour.active()) {
<div #spot class="tour-spotlight" [class.is-empty]="!tour.step().target" aria-hidden="true"></div>

<section #card class="tour-card fixed z-[70] w-[min(40rem,calc(100vw-2rem))]" [class.tour-card--top]="placement() === 'top'"
  role="region" [attr.aria-label]="t().label">
  <div class="tour-card__inner rounded-3xl p-5 sm:p-6">

    <div class="flex items-center gap-4">
      <div #orb class="tour-orb" aria-hidden="true">
        <span class="tour-orb__core"></span>
        <span class="tour-orb__bars">
          @for (bar of bars; track $index) {
          <span #bar class="tour-orb__bar"></span>
          }
        </span>
      </div>

      <div class="min-w-0 flex-1">
        <p class="font-mono text-[11px] uppercase tracking-[0.25em] text-teal-200/70">
          {{ t().step }} {{ counter() }}
        </p>
        <h2 class="truncate text-lg sm:text-xl font-semibold tracking-tight text-white">{{ tour.text().title }}</h2>
      </div>

      <button type="button" (click)="tour.stop()" [attr.aria-label]="t().close"
        class="grid h-9 w-9 shrink-0 place-items-center rounded-full text-white/60 transition-colors hover:bg-white/10 hover:text-white">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <p class="tour-caption mt-4 text-[15px] sm:text-base leading-relaxed">
      @for (word of words(); track $index) {<span [class.is-spoken]="$index < spoken()">{{ word }}</span>}
    </p>

    <div class="mt-5 flex items-center gap-4">
      <div class="flex flex-1 gap-1" aria-hidden="true">
        @for (step of tour.steps; track step.id) {
        <span class="tour-seg" [class.is-done]="$index < tour.index()">
          @if ($index === tour.index()) {
          <span #fill class="tour-seg__fill"></span>
          }
        </span>
        }
      </div>

      <div class="flex shrink-0 items-center gap-1">
        <button type="button" (click)="tour.prev()" [disabled]="tour.isFirst()" [attr.aria-label]="t().prev"
          class="grid h-9 w-9 place-items-center rounded-full text-white/80 transition-colors hover:bg-white/10 hover:text-white disabled:opacity-30 disabled:hover:bg-transparent">
          <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"></path>
          </svg>
        </button>

        <button type="button" (click)="tour.togglePause()" [attr.aria-label]="tour.paused() ? t().play : t().pause"
          class="grid h-11 w-11 place-items-center rounded-full bg-white text-slate-900 shadow-lg transition-transform hover:scale-105 active:scale-95">
          @if (tour.paused()) {
          <svg class="ml-0.5 h-5 w-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14l11-7z"></path>
          </svg>
          } @else {
          <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path>
          </svg>
          }
        </button>

        <button type="button" (click)="tour.next()" [attr.aria-label]="t().next"
          class="grid h-9 w-9 place-items-center rounded-full text-white/80 transition-colors hover:bg-white/10 hover:text-white">
          <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"></path>
          </svg>
        </button>
      </div>
    </div>

    @if (tour.audioMissing()) {
    <p class="mt-3 text-xs text-white/40">{{ t().noAudio }}</p>
    }
  </div>
</section>
}
