# Worker du formulaire de contact : https://api-contact.gaetandev.fr
# Déploiement et secrets : voir docs/features/contact.md (section « Worker api-contact »).
name = "api-contact"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

routes = [
  { pattern = "api-contact.gaetandev.fr", custom_domain = true },
]

[observability]
enabled = true

# Pas de [vars] : les valeurs publiques (ALLOWED_ORIGINS, identifiants EmailJS publics)
# sont par défaut dans DEFAULT_CONFIG (src/index.js), pour que le worker marche aussi
# collé dans le dashboard. Une variable définie ici ou dans le dashboard les remplace.
#
# Secrets obligatoires :
#   npx wrangler secret put GD_CAPTCHA_SECRET
#   npx wrangler secret put EMAILJS_PRIVATE_KEY
